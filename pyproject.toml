[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milcheck"
version = "0.2.0"
description = "공개 계약데이터를 학습한 폐쇄망 군 계약 사전점검 AI 에이전트"
requires-python = ">=3.11"
dependencies = []          # 운영에는 표준 라이브러리만 필요하다

[project.optional-dependencies]
training = ["pandas>=2.0", "scikit-learn>=1.3", "numpy>=1.24"]

[project.scripts]
milcheck = "milcheck.cli:main"

[tool.setuptools]
packages = ["milcheck"]
